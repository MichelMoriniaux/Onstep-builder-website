# JTW Firmware Builder — nginx site.
# Install as /etc/nginx/sites-available/jtwgen and symlink into sites-enabled.
# Serves the built SPA from /var/www/jtwgen/web and proxies /api to the api
# container (docker-compose.prod.yml publishes it on 127.0.0.1:8080).

server {
    listen 80;
    listen [::]:80;
    server_name jtwgen.short-circuit.org;   # <-- adjust to your DNS name

    root /var/www/jtwgen/web;
    index index.html;

    # Uploaded configs are small; keep a modest cap (mirrors the API limit).
    client_max_body_size 4m;

    access_log /var/log/nginx/jtwgen.access.log;
    error_log  /var/log/nginx/jtwgen.error.log;

    # Security headers (applied to all responses in this server; locations below
    # deliberately avoid add_header so they inherit these).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Self-contained SPA: no third-party origins. 'unsafe-inline' only for styles.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # SPA: fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + live build log (SSE). SSE needs buffering off and a long read timeout.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Cache built static assets (they are content-hashed by Vite). No add_header
    # here so the security headers above are inherited; `expires` sets caching.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }
}
